name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. trb run ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: trb doctor output
      description: Run `trb doctor` and paste the output. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: trb 0.5.0, Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
