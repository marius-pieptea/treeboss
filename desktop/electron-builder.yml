appId: com.devotomy.treeboss
productName: TreeBoss
# Updates come from GitHub Releases; electron-builder writes latest*.yml beside the installers.
publish:
  provider: github
  owner: marius-pieptea
  repo: treeboss
  releaseType: release   # publish directly; the default is a draft, which updaters cannot see
directories:
  output: dist
files:
  - main.cjs
  - preload.cjs
  - updater.cjs
  - package.json
# Per-platform payload: the compiled daemon for that OS/arch, plus the built web UI.
extraResources:
  - from: stage/web
    to: web
mac:
  category: public.app-category.developer-tools
  # The zip is what the mac updater downloads (the dmg is for first installs).
  target:
    - dmg
    - zip
  identity: null          # unsigned for now; set MAC_SIGNED in updater.cjs once signed
  extraResources:
    - from: stage/bin/darwin-${arch}
      to: bin
    # The skill packs sit beside the daemon, where the compiled trb looks for them (src/skills/packs.ts).
    - from: stage/packs
      to: packs
dmg:
  artifactName: TreeBoss-${version}-mac-${arch}.dmg
win:
  target: nsis
  signExecutable: false          # unsigned; keeps the exe icon and metadata (rcedit) applied
  extraResources:
    - from: stage/bin/windows-x64
      to: bin
    # The skill packs sit beside the daemon, where the compiled trb looks for them (src/skills/packs.ts).
    - from: stage/packs
      to: packs
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: TreeBoss-Setup-${version}.exe
  # Adds the integration checkboxes (folder/file context menus, editor registration, PATH). See build/installer.nsh.
  include: build/installer.nsh
linux:
  target:
    - AppImage
    - tar.gz
  category: Development
  icon: build/icon.png
  artifactName: TreeBoss-${version}-linux-${arch}.${ext}
  extraResources:
    - from: stage/bin/linux-${arch}
      to: bin
    # The skill packs sit beside the daemon, where the compiled trb looks for them (src/skills/packs.ts).
    - from: stage/packs
      to: packs
